# Namuna: to'lovlar monitoringi `davijara.uz/payments` sub-path ostida.
#
# Mavjud davijara.uz server blokiga (obyektlar `location ^~ /obyektlar` yoniga) qo'shiladi:
#   sudo nano /etc/nginx/sites-available/davijara.uz
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ `proxy_pass` da yo'l YO'Q — nginx `/payments/...` ni o'zgartirmasdan uzatadi.
#    Bu SHART: ilova `basePath: "/payments"` bilan qurilgan.

    location ^~ /payments {
        proxy_pass http://127.0.0.1:3001;   # ⚠️ path YO'Q — prefiks saqlanadi
        proxy_http_version 1.1;

        # ⚠️ Auth.js (trustHost) va middleware'dagi login redirect shu sarlavhalarga tayanadi.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Katta Excel eksporti (oqim) va og'ir hisobotlar uchun.
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_redirect off;
    }
